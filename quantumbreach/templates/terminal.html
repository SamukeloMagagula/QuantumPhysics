{% extends "base.html" %}
{% block title %}PhantomShell — PhantomQ{% endblock %}
{% block content %}
<h1 data-typewriter>PhantomShell</h1>
<p class="muted">A simulated shell. Try <code>help</code>, <code>caesar -d 3 Khoor</code>, or <code>lab create</code>.</p>
<div id="shell" class="shell">
  <div id="shell-out" class="shell-out"></div>
  <div class="shell-row"><span class="shell-prompt">$</span><input id="shell-in" class="shell-in" autocomplete="off" spellcheck="false"></div>
</div>
<script>window.__PQ_USER = {{ (user.display_name if user else 'operative') | tojson }};</script>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/labs.js') }}"></script>
  <script src="{{ url_for('static', filename='js/vfs.js') }}"></script>
  <script src="{{ url_for('static', filename='js/terminal.js') }}"></script>
  <script src="{{ url_for('static', filename='js/shell-fs.js') }}"></script>
  <script src="{{ url_for('static', filename='js/shell-text.js') }}"></script>
  <script src="{{ url_for('static', filename='js/shell-net.js') }}"></script>
  <script src="{{ url_for('static', filename='js/shell-sys.js') }}"></script>
{% endblock %}
