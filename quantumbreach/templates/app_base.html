<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PhantomQ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shell.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/stage.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <canvas id="fx-bg"></canvas>
  <div id="fx-scan"></div>
  <div id="boot"><div class="line"></div></div>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='js/crypto.js') }}"></script>
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/effects.js') }}"></script>
  <script src="{{ url_for('static', filename='js/nav.js') }}"></script>
  <script src="{{ url_for('static', filename='js/chatbot-kb.js') }}"></script>
  <script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
</body>
</html>
